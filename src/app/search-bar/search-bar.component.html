  <div id="main-content" class="w-full max-w-screen-md px-1">

  <div class="search-container">
  <input
    type="text"
    [(ngModel)]="searchQuery"
    class="search-input"
    placeholder="youtube.com/123save"
  />
  <button (click)="onSearchClick2()" class="search-button">
    <span class="material-icons">search</span>
  </button>

</div>

 <div class="overlay-content">

    <!-- Countdown button -->
    <button *ngIf="!countdownStarted" (click)="startCountdownAndShowImage()">
      Start Countdown
    </button>

    <!-- Image shown while countdown is running -->
    <div
      *ngIf="countdownStarted && !countdownDone"
     
    >
<img src="assets/angular.png" alt="Angular Logo" class="resized-img"/>

    </div>

    <!-- Countdown display -->
    <div *ngIf="countdownStarted && !countdownDone" class="count">
      {{ countdown }}s
    </div>

    <!-- Final message -->
    <div *ngIf="countdownDone" class="message">
      Countdown Complete!
    </div>

        <app-search-bar></app-search-bar>

  </div>

</div>
