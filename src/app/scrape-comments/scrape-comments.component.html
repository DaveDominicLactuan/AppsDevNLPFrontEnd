<div class="container">
  <h2>YouTube Comments Scraper</h2>
  <input [(ngModel)]="videoUrl" type="text" placeholder="Enter YouTube URL" />
  <button (click)="fetchComments()">Fetch Comments</button>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" style="color:red">{{ error }}</div>

  <ul *ngIf="comments.length > 0">
    <li *ngFor="let comment of comments">{{ comment }}</li>
  </ul>
</div>
